<!DOCTYPE html>
<html>
<head>
    <title>Mental Health Prediction</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Mental Health Prediction System</h1>

        <form action="/predict" method="POST">

            <label>Gender:</label>
            <select name="gender" required>
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>

            <label>Age:</label>
            <input type="number" name="age" required>

            <label>Academic Pressure (1-10):</label>
            <input type="number" name="academic_pressure" required>

            <label>Work Pressure (1-10):</label>
            <input type="number" name="work_pressure" required>

            <label>CGPA:</label>
            <input type="number" step="0.1" name="cgpa" required>

            <label>Study Satisfaction (1-10):</label>
            <input type="number" name="study_satisfaction" required>

            <label>Job Satisfaction (1-10):</label>
            <input type="number" name="job_satisfaction" required>

            <label>Sleep Duration:</label>
            <select name="sleep_duration" required>
                <option value="0">Less than 5 hours</option>
                <option value="1">5-6 hours</option>
                <option value="2">7-8 hours</option>
                <option value="3">More than 8 hours</option>
            </select>

            <label>Dietary Habits:</label>
            <select name="dietary_habits" required>
                <option value="0">Unhealthy</option>
                <option value="1">Moderate</option>
                <option value="2">Healthy</option>
            </select>

            <label>Suicidal Thoughts:</label>
            <select name="suicidal_thoughts" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Work/Study Hours:</label>
            <input type="number" name="work_study_hours" required>

            <label>Financial Stress (1-10):</label>
            <input type="number" name="financial_stress" required>

            <label>Family History of Mental Illness:</label>
            <select name="family_history" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <button type="submit">Predict</button>

            <a href="/chatbot">Open Friendly Chatbot</a>
            <a href="/recommendation">View Recommendations</a>

        </form>
    </div>

</body>
</html>
